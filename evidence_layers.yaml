# TROPIC evidence-layer index.
#
# Purpose: map the existing repository into the target evidence chain without
# moving files. This is an architectural control file, not a build manifest.
# Execution order remains governed by study_manifest.yaml.

version: 1
study: TROPIC-NCT00417079
evidence_chain:
  - source_data
  - specification
  - metadata
  - analysis_dataset
  - output
  - qc_evidence
  - reviewer_explanation

status_definitions:
  required: "Must exist in the repository for the architecture check to pass."
  generated: "Build artifact; may be absent in a clean clone, but should be produced by the pipeline."
  external: "Intentionally excluded from git because it is patient data, credentialed input, or governed source material."
  optional: "Useful artifact or tool, but not required for the architecture check."
  planned: "Target-state placeholder; not yet implemented."

layers:
  source_data:
    objective: "Document controlled source intake, data access limits, source profiling, and source-to-analysis mapping."
    artifacts:
      - path: REPRODUCIBILITY.md
        status: required
        role: "Data-access and reproducibility boundary."
      - path: 01_raw_source
        status: required
        role: "Current source-data landing area."
      - glob: "01_raw_source/real_sdtm/*.sas7bdat"
        status: external
        role: "Official de-identified SDTM source files; intentionally not redistributed."
      - glob: "01_raw_source/cbzp_reconstructed/*.rds"
        status: external
        role: "Regenerable synthetic comparator artifacts; intentionally not committed."
      - path: 01_raw_source/reconstruct_cbzp_arm.R
        status: optional
        role: "Synthetic comparator reconstruction program, when present."
      - path: 06_telemetry/build_source_profile.py
        status: required
        role: "Aggregate source profiling report generator."
      - path: docs/SOURCE_PROFILING_REPORT.md
        status: generated
        role: "Aggregate source profiling report."
      - path: 06_telemetry/source_profile_status.json
        status: generated
        role: "Machine-readable source profiling status."
      - path: 06_telemetry/source_profile/domain_inventory.csv
        status: generated
        role: "Aggregate source domain inventory."
      - path: 06_telemetry/source_profile/variable_profile.csv
        status: generated
        role: "Aggregate source variable profile."

  specification:
    objective: "Control clinical analysis authority: SAP lock, assumptions, clinical parameters, and derivation rules."
    artifacts:
      - path: TROPIC_SAP_v4.0_industry_grade.docx
        status: required
        role: "Current SAP authority identified by the lock review."
      - path: audit/SAP_LOCK_REVIEW_MEMO.md
        status: required
        role: "Decision record for SAP v4.0 authority and non-submission-ready status."
      - path: study_config.yaml
        status: required
        role: "Study clinical parameters consumed by programs."
      - path: study_manifest.yaml
        status: required
        role: "Pipeline structure and dataset/program wiring."
      - path: docs/PIPELINE_ARCHITECTURE_REDESIGN.md
        status: required
        role: "Target operating model and migration plan."
      - path: docs/BIOMETRICS_DELIVERY_OPERATING_MODEL.md
        status: required
        role: "Cross-functional biometrics delivery operating model."
      - path: docs/REGULATORY_WORKFLOW_RESEARCH.md
        status: required
        role: "Research-backed department workflow and validation model."
      - path: delivery_workstreams.yaml
        status: required
        role: "Machine-readable workstream, gate, and handoff contract."
      - path: validation_strategy.yaml
        status: required
        role: "Machine-readable risk-based validation strategy."
      - path: ctq_traceability.yaml
        status: required
        role: "Machine-readable CTQ, estimand, artifact, and validation traceability register."

  metadata:
    objective: "Provide machine-readable and reviewer-readable dataset metadata, controlled terminology, and traceability."
    artifacts:
      - path: 00_specifications/ADaM_spec.xlsx
        status: required
        role: "ADaM specification and metadata control source."
      - path: 07_define_xml/define.xml
        status: required
        role: "ADaM Define-XML with ARM."
      - path: 07_define_xml/define_sdtm.xml
        status: required
        role: "SDTM Define-XML."
      - path: 07_define_xml/validate_xsd.sh
        status: required
        role: "Define-XML schema validation runner."
      - path: 07_define_xml/check_define_conformance.R
        status: required
        role: "Spec-to-define conformance check."
      - path: metadata_lineage.yaml
        status: required
        role: "Governed ADaM predecessor lineage and sponsor-defined CT disposition register."
      - path: 06_telemetry/apply_metadata_lineage.py
        status: required
        role: "Applies and checks governed predecessor lineage against the ADaM specification workbook."
      - path: 06_telemetry/build_metadata_control_report.py
        status: required
        role: "Metadata governance report generator."
      - path: 08_reviewers_guides/TRACEABILITY_MATRIX.md
        status: required
        role: "Human-readable traceability matrix."
      - path: audit/adam_variable_traceability.csv
        status: required
        role: "Machine-readable ADaM variable traceability extract."
      - path: docs/METADATA_CONTROL_REPORT.md
        status: generated
        role: "Generated metadata governance report."
      - path: 06_telemetry/metadata_control/metadata_control_status.json
        status: generated
        role: "Machine-readable metadata governance status."
      - path: 06_telemetry/metadata_control/metadata_dataset_control.csv
        status: generated
        role: "Dataset-level metadata control extract."
      - path: 06_telemetry/metadata_control/metadata_findings.csv
        status: generated
        role: "Metadata governance findings extract."
      - path: 06_telemetry/metadata_lineage/metadata_lineage_status.json
        status: generated
        role: "Machine-readable lineage application/check status."
      - path: 06_telemetry/metadata_lineage/metadata_lineage_application.csv
        status: generated
        role: "Variable-level lineage check extract."

  analysis_dataset:
    objective: "Build and exchange SDTM/ADaM analysis datasets with reproducible program provenance."
    artifacts:
      - path: 02_production_sas
        status: required
        role: "SAS production ADaM programs."
      - path: 03_validation_r
        status: required
        role: "Independent R validation programs."
      - path: 04_adam
        status: required
        role: "Current ADaM XPT output directory."
      - glob: "04_adam/*.xpt"
        status: generated
        role: "Generated ADaM transport files."
      - path: 10_datasetjson/README.md
        status: required
        role: "Dataset-JSON export documentation."
      - glob: "10_datasetjson/**/*.json"
        status: generated
        role: "Generated Dataset-JSON metadata and data files."
      - glob: "10_datasetjson/**/*.ndjson"
        status: generated
        role: "Generated Dataset-JSON NDJSON payload files."

  output:
    objective: "Generate traceable tables, figures, listings, and analysis-results metadata."
    artifacts:
      - path: 09_tfl/tfl_generation.R
        status: required
        role: "TFL generation program."
      - path: 09_tfl/tfl_stats.R
        status: required
        role: "TFL statistical helper program."
      - path: tfl_output_catalog.yaml
        status: required
        role: "Controlled TFL release-scope catalog (SAP full vs in-scope/deferred dispositions)."
      - path: 06_telemetry/build_tfl_output_index.py
        status: required
        role: "Structured TFL output index generator."
      - path: 09_tfl/TFL_Gallery.html
        status: generated
        role: "Rendered TFL gallery."
      - path: 09_tfl/output
        status: generated
        role: "Rendered table/figure/listing output directory."
      - path: 12_ars/tropic_ard.csv
        status: generated
        role: "Analysis Results Standard ARD."
      - path: 12_ars/tropic_reporting_event.json
        status: generated
        role: "Analysis Results Standard reporting event."
      - path: 13_usdm/tropic_usdm.json
        status: generated
        role: "USDM study definition export."
      - path: docs/TFL_OUTPUT_INDEX.md
        status: generated
        role: "Structured TFL output traceability index."
      - path: 06_telemetry/tfl_output_index_status.json
        status: generated
        role: "Machine-readable TFL output index status."
      - path: 06_telemetry/tfl_output_index/tfl_output_index.csv
        status: generated
        role: "CSV TFL output traceability index."
      - path: 06_telemetry/tfl_output_index/tfl_output_index.json
        status: generated
        role: "JSON TFL output traceability index."

  qc_evidence:
    objective: "Capture risk-based validation, reconciliation, conformance, run telemetry, manifests, and audit evidence."
    artifacts:
      - path: 08_reviewers_guides/RISK_BASED_VALIDATION.md
        status: required
        role: "Risk-tiered statistical validation plan."
      - path: 08_reviewers_guides/ORCHESTRATOR_ASSURANCE_RATIONALE.md
        status: required
        role: "Engineering assurance rationale for the orchestrator."
      - path: 05_reconciliation
        status: required
        role: "Dataset and results reconciliation programs."
      - path: 06_telemetry/cibuild.py
        status: required
        role: "Pipeline orchestrator."
      - path: 06_telemetry/build_delivery_controls.py
        status: required
        role: "Unified delivery architecture control runner for local and CI use."
      - path: 06_telemetry/check_evidence_layers.py
        status: required
        role: "Evidence-layer architecture verifier."
      - path: 06_telemetry/check_delivery_model.py
        status: required
        role: "Delivery workstream and gate model verifier."
      - path: 06_telemetry/build_delivery_dashboard.py
        status: required
        role: "Delivery evidence dashboard generator."
      - path: 06_telemetry/build_release_candidate_checklist.py
        status: required
        role: "Release-candidate go/no-go checklist generator."
      - path: log_cleanliness.yaml
        status: required
        role: "Governed log-cleanliness rules and reviewed exception caps."
      - path: 06_telemetry/check_log_cleanliness.py
        status: required
        role: "Automated SAS/R execution-log scanner."
      - path: 06_telemetry/build_validation_strategy_report.py
        status: required
        role: "Risk-based validation strategy control report generator."
      - path: 06_telemetry/build_ctq_traceability_report.py
        status: required
        role: "CTQ and estimand traceability report generator."
      - path: 06_telemetry/build_orchestrator_gate_map.py
        status: required
        role: "Orchestrator stage-to-delivery-gate map generator."
      - path: 06_telemetry/build_release_run_manifest.py
        status: required
        role: "Current release-run hash binding manifest generator."
      - path: 06_telemetry/pipeline_health.json
        status: generated
        role: "Latest run health record."
      - path: 06_telemetry/reconciliation_status.json
        status: generated
        role: "Dataset-level reconciliation status."
      - path: 06_telemetry/results_reconciliation_status.json
        status: generated
        role: "Results-level reconciliation status."
      - path: 06_telemetry/conformance/spec_define_conformance.json
        status: generated
        role: "Spec-to-define conformance result."
      - path: 06_telemetry/conformance/spec_data_conformance.json
        status: generated
        role: "Spec-to-data conformance result."
      - path: audit/findings_register.csv
        status: required
        role: "Audit findings register."
      - path: audit/output_hash_binding.csv
        status: required
        role: "Current output-to-package hash binding evidence."
      - path: 06_telemetry/release_run_manifest/release_run_manifest.json
        status: generated
        role: "Machine-readable current release-run manifest and hash seal."
      - path: 06_telemetry/release_run_manifest/release_run_files.csv
        status: generated
        role: "Per-file hash ledger bound into the release-run manifest."
      - path: docs/RELEASE_RUN_MANIFEST.md
        status: generated
        role: "Reviewer-readable release-run manifest summary."
      - path: docs/RELEASE_CANDIDATE_CHECKLIST.md
        status: generated
        role: "Generated release-candidate go/no-go checklist."
      - path: docs/VALIDATION_STRATEGY_CONTROL_REPORT.md
        status: generated
        role: "Generated risk-based validation strategy control report."
      - path: docs/CTQ_TRACEABILITY_REPORT.md
        status: generated
        role: "Generated CTQ and estimand traceability report."
      - path: 06_telemetry/ctq_traceability/ctq_traceability_status.json
        status: generated
        role: "Machine-readable CTQ traceability status."
      - path: 06_telemetry/ctq_traceability/ctq_traceability_checks.csv
        status: generated
        role: "CSV CTQ traceability check results."
      - path: 06_telemetry/validation_strategy/validation_strategy_status.json
        status: generated
        role: "Machine-readable risk-based validation strategy status."
      - path: 06_telemetry/validation_strategy/validation_strategy_checks.csv
        status: generated
        role: "CSV evidence check results for the validation strategy."
      - path: docs/LOG_CLEANLINESS_REPORT.md
        status: generated
        role: "Generated SAS/R execution-log cleanliness report."
      - path: 06_telemetry/log_cleanliness/log_cleanliness_status.json
        status: generated
        role: "Machine-readable log-cleanliness gate status."
      - path: 06_telemetry/log_cleanliness/log_findings.csv
        status: generated
        role: "CSV log-cleanliness findings and reviewed exceptions."
      - path: 06_telemetry/release_candidate/release_candidate_status.json
        status: generated
        role: "Machine-readable release-candidate status."
      - path: 06_telemetry/release_candidate/release_candidate_checklist.csv
        status: generated
        role: "CSV release-candidate checklist."
      - path: docs/ORCHESTRATOR_GATE_MAP.md
        status: generated
        role: "Generated map from runtime DAG stages to delivery gates."
      - path: 06_telemetry/orchestrator_gate_map/orchestrator_gate_map_status.json
        status: generated
        role: "Machine-readable orchestrator gate-map status."
      - path: 06_telemetry/orchestrator_gate_map/orchestrator_gate_map.csv
        status: generated
        role: "CSV orchestrator stage-to-gate map."

  reviewer_explanation:
    objective: "Explain datasets, conformance, assumptions, limitations, outputs, and validation to a reviewer."
    artifacts:
      - path: 08_reviewers_guides/ADRG.md
        status: required
        role: "Analysis Data Reviewer's Guide."
      - path: 08_reviewers_guides/SDRG.md
        status: required
        role: "Study Data Reviewer's Guide."
      - path: 08_reviewers_guides/BDRG.md
        status: required
        role: "BIMO Data Reviewer's Guide."
      - path: 08_reviewers_guides/SDSP.md
        status: required
        role: "Study Data Standardization Plan."
      - path: ANALYSIS_REPORT.md
        status: required
        role: "Reviewer-facing analysis report and concordance narrative."
      - path: docs/DELIVERY_EVIDENCE_DASHBOARD.md
        status: generated
        role: "Generated delivery/evidence architecture dashboard."
      - path: README.md
        status: required
        role: "Public package orientation and limitation disclosure."

  submission_package:
    objective: "Materialize an eCTD-style package after data, metadata, outputs, QC, and reviewer explanation gates pass."
    artifacts:
      - path: m5
        status: generated
        role: "Current eCTD Module 5 style payload tree."
      - path: 11_ectd/0000
        status: generated
        role: "Materialized sequence 0000."
      - path: 11_ectd/RUN_RECORD.md
        status: generated
        role: "eCTD materialization run record."
      - path: 06_telemetry/package_ectd.py
        status: required
        role: "Module 5 package builder."
      - path: 06_telemetry/build_ectd_backbone.py
        status: required
        role: "eCTD backbone/STF builder."
      - path: 06_telemetry/materialize_ectd.py
        status: required
        role: "Sequence materialization script."
