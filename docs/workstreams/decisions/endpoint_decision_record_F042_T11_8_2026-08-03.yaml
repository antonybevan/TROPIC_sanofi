decisions:
  - id: ED-01
    status: recommended_pending_signature
    question: TTPAIN/PFS pain progression supporting disease evidence
    current_state: The protocol requires cancer-related clinical and/or radiological evidence; no signed operational rule exists.
    proposed_direction: Apply Approval Specification sections 3-5; accept qualifying evidence no later than the confirming visit or direct-intent palliative/antalgic RT; do not use PSA alone or later backdating.
    approval_roles: [sponsor_statistician, medical_reviewer]
    blocks:
      - pfs_derivation_change
      - filing_facing_endpoint_claim

  - id: ED-02
    status: recommended_pending_signature
    question: Palliative radiotherapy source and precedence
    current_state: Direct-intent RT evidence occurs in 13 CM rows/10 subjects and 3 PR rows/1 different subject; PR is not staged.
    proposed_direction: Stage full PR and use a provenance-preserving CM+PR union; require radiation plus explicit PALLIATIVE or ANTALGIC text; auto-collapse exact subject/date duplicates only.
    approval_roles: [sponsor_statistician, medical_reviewer]
    blocks:
      - pr_staging
      - palliative_rt_derivation

  - id: ED-03
    status: recommended_pending_signature
    question: Palliative-RT-only sensitivity
    current_state: SAP mentions palliative radiotherapy, but no controlled sensitivity output is produced.
    proposed_direction: Primary diary-or-RT analysis plus diary-only sensitivity, RT-only supportive analysis, and bounded missing-date review.
    approval_roles: [sponsor_statistician]
    blocks:
      - sensitivity_programming

  - id: ED-04
    status: recommended_pending_signature
    question: SAP T-11-8 collision
    current_state: SAP T-11-8 is TTPAIN; current physical T-11-8 is response summary.
    proposed_direction: Restore SAP-native mappings T-11-3 PSA response, T-11-4 ORR, T-11-5 pain response, T-11-6 TTUMOR, T-11-7 TTPSA, and T-11-8 TTPAIN.
    recommended_option: restore_complete_sap_native_t_11_3_through_t_11_8_mapping
    approval_roles: [sponsor_statistician]
    blocks:
      - tfl_catalog_change
      - metadata_reseal

  - id: ED-05
    status: recommended_pending_signature
    question: TTUMOR population
    current_state: Path A uses ITT measurable disease; SAP Table 22 wording requires clarification.
    proposed_direction: Use ITT as the primary TTUMOR population; retain measurable disease as supportive subgroup/sensitivity only.
    approval_roles: [sponsor_statistician]

  - id: ED-06
    status: recommended_pending_signature
    question: Secondary TTE time origins
    current_state: RANDDT anchors OS/PFS/TTPAIN/TTPSA/TTUMOR; TRTSDT anchors TTSAE; one reviewer-guide passage conflicts.
    proposed_direction: Approve parameter-level origins and synchronize reviewer-facing documentation.
    approval_roles: [sponsor_statistician]

  - id: ED-07
    status: recommended_pending_signature
    question: Exact pain progression algorithm
    current_state: Current code uses median AS, PPI >=2, absolute AS >=10, combined-component confirmation, minimum diary date, and a terminal-trigger exception.
    proposed_direction: Apply Approval Specification sections 3-4 with component-specific 5-of-7 summaries, PPI >=1, mean AS >=25% from positive baseline, same-component confirmation at consecutive scheduled evaluations at least 21 days apart without bridging a missing/non-evaluable visit, no terminal exception, RT standalone, and SV date hierarchy.
    approval_roles: [sponsor_statistician, medical_reviewer]
    blocks:
      - ttpain_derivation_change
      - pfs_pain_component_change

