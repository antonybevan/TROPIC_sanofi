# TROPIC validation strategy.
#
# Purpose: machine-readable implementation of risk-based, traceability-driven,
# specification-controlled validation. This file answers: what is the artifact,
# why does it matter, what evidence is required, and what telemetry proves it.

version: 1
study: TROPIC-NCT00417079
authority:
  research_basis: docs/REGULATORY_WORKFLOW_RESEARCH.md
  reviewer_plan: 07_reviewer_explanation/guides/RISK_BASED_VALIDATION.md

risk_tiers:
  critical:
    meaning: "Incorrect evidence could change the primary interpretation, population, safety conclusion, or release claim."
    minimum_evidence: "Independent reproduction or independently implemented check, source-to-result traceability, metadata conformance, and release-run binding."
  high:
    meaning: "Incorrect evidence could materially affect important secondary/supportive interpretation or reviewer confidence."
    minimum_evidence: "Independent targeted check or result reconciliation, metadata/specification control, and documented QC signoff."
  medium:
    meaning: "Incorrect evidence is unlikely to change the main conclusion but could confuse review or weaken traceability."
    minimum_evidence: "Automated checks, peer/code review evidence, metadata/specification control, and targeted spot checks."
  low:
    meaning: "Incorrect evidence is cosmetic, navigational, or operationally recoverable."
    minimum_evidence: "Generation check, checksum/smoke test, and review where applicable."

checks:
  current_real_sas:
    file: platform/pipeline_health.json
    field: sas_execution_mode
    op: in
    value: [oda, local]
    evidence: "Current live run used an independent SAS engine."
  pipeline_green:
    file: platform/pipeline_health.json
    field: pipeline_health_status
    op: equals
    value: GREEN
    evidence: "Current pipeline health is green."
  dataset_reconciliation_pass:
    file: platform/reconciliation_status.json
    field: overall
    op: equals
    value: PASS
    evidence: "Dataset-level reconciliation passed."
  dataset_reconciliation_not_simulated:
    file: platform/reconciliation_status.json
    field: simulated
    op: equals
    value: false
    evidence: "Dataset-level reconciliation is not a byte-copy simulation."
  results_reconciliation_pass:
    file: platform/results_reconciliation_status.json
    field: overall
    op: equals
    value: PASS
    evidence: "Numerical results reconciliation passed."
  admiral_adsl_pass:
    file: platform/admiral_reconciliation_status.json
    field: domains.ADSL.status
    op: equals
    value: PASS
    evidence: "Third-engine ADSL reconciliation passed."
    # Prefer same-run DAG stage PASS; else refuse historical status vs health timestamp.
    require_not_stale_vs:
      file: platform/pipeline_health.json
      field: timestamp
      pipeline_stage: Admiral Core Reconciliation
  admiral_os_pass:
    file: platform/admiral_reconciliation_status.json
    field: domains.ADTTE.OS.status
    op: equals
    value: PASS
    evidence: "Third-engine OS reconciliation passed."
    require_not_stale_vs:
      file: platform/pipeline_health.json
      field: timestamp
      pipeline_stage: Admiral Core Reconciliation
  admiral_pfs_pass:
    file: platform/admiral_reconciliation_status.json
    field: domains.ADTTE.PFS.status
    op: equals
    value: PASS
    evidence: "Third-engine PFS reconciliation passed."
    require_not_stale_vs:
      file: platform/pipeline_health.json
      field: timestamp
      pipeline_stage: Admiral Core Reconciliation
  spec_define_pass:
    file: platform/conformance/spec_define_conformance.json
    field: status
    op: equals
    value: PASS
    evidence: "ADaM specification matches Define-XML."
  spec_data_pass:
    file: platform/conformance/spec_data_conformance.json
    field: status
    op: equals
    value: PASS
    evidence: "ADaM specification matches produced data."
  metadata_control_pass:
    file: platform/metadata_control/metadata_control_status.json
    field: status
    op: equals
    value: pass
    evidence: "Metadata control has no unresolved warning/blocking findings."
  tfl_index_pass:
    file: platform/tfl_output_index_status.json
    field: status
    op: equals
    value: pass
    evidence: "TFL output index is complete for controlled catalog scope (config/tfl_output_catalog.yaml)."
  forest_reconciliation_pass:
    file: platform/forest_reconciliation_status.json
    field: overall
    op: equals
    value: PASS
    evidence: "Forest HR result reconciliation passed."
  cbzp_bridge_pass:
    file: platform/cbzp_bridge_status.json
    field: overall
    op: equals
    value: PASS
    evidence: "Synthetic comparator bridge parity passed."
  source_profile_pass:
    file: platform/source_profile_status.json
    field: status
    op: equals
    value: pass
    evidence: "Source profile completed without findings."
  ctq_traceability_pass:
    file: platform/ctq_traceability/ctq_traceability_status.json
    field: status
    op: equals
    value: PASS
    evidence: "CTQ/estimand traceability links clinical questions to ADaM, outputs, reviewer guides, and validation evidence."
  log_cleanliness_pass:
    file: platform/log_cleanliness/log_cleanliness_status.json
    field: status
    op: equals
    value: PASS
    evidence: "SAS/R execution logs contain no unapproved errors, warnings, invalid-input notes, uninitialized variables, or risky conversion/merge notes."
  simulation_execution_pass:
    file: platform/simulation_operating_characteristics/simulation_oc_status.json
    field: statuses.execution.status
    op: equals
    value: PASS
    evidence: "The governed simulation run completed with exact requested/completed/failed accounting."
  simulation_precision_pass:
    file: platform/simulation_operating_characteristics/simulation_oc_status.json
    field: statuses.monte_carlo_precision.status
    op: equals
    value: PASS
    evidence: "All scenarios met their prespecified replication, failure-rate, and Monte Carlo precision controls."
  simulation_design_check_pass:
    file: platform/simulation_operating_characteristics/simulation_oc_status.json
    field: statuses.design_operating_characteristics.status
    op: equals
    value: PASS
    evidence: "The analytic-null and deterministic method checks passed; alternative power remains descriptive without a clinical threshold."
  simulation_boundary_preserved:
    file: platform/simulation_operating_characteristics/simulation_oc_status.json
    field: statuses.evidence_qualification.status
    op: equals
    value: NOT_QUALIFIED
    evidence: "The evidence remains explicitly informative, data-free, non-MIDD, and non-confirmatory."

artifacts:
  - id: source_profile
    name: Source intake profile
    owner: clinical_data_management
    gate: G01
    risk_tier: high
    decision_impact: "Controls source inventory, subject count, critical variable presence, and intake readiness."
    traceability: "source data -> source profiling -> analysis specification"
    required_checks: [source_profile_pass]

  - id: adsl
    name: ADSL subject-level analysis dataset
    owner: statistical_programming
    gate: G04
    risk_tier: critical
    decision_impact: "Defines populations, treatment anchors, demographics, and subject-level covariates used across all analyses."
    traceability: "SDTM DM/SV/EX -> SAP populations/windows -> ADaM spec -> ADSL -> TFLs/ADRG"
    required_checks:
      - current_real_sas
      - dataset_reconciliation_pass
      - dataset_reconciliation_not_simulated
      - admiral_adsl_pass
      - spec_data_pass

  - id: adtte_primary
    name: ADTTE primary efficacy parameters OS/PFS
    owner: statistical_programming
    gate: G04
    risk_tier: critical
    decision_impact: "Primary efficacy interpretation and headline time-to-event evidence."
    traceability: "SDTM dates/events -> SAP estimand/censoring -> ADTTE -> KM/HR outputs -> CSR/ADRG"
    required_checks:
      - current_real_sas
      - dataset_reconciliation_pass
      - dataset_reconciliation_not_simulated
      - results_reconciliation_pass
      - admiral_os_pass
      - admiral_pfs_pass
      - spec_data_pass

  - id: adtte_secondary
    name: ADTTE secondary/supportive TTE parameters
    owner: statistical_programming
    gate: G04
    risk_tier: high
    decision_impact: "Important supportive efficacy interpretation."
    traceability: "SDTM dates/events -> SAP secondary endpoints -> ADTTE -> TFL outputs"
    required_checks:
      - current_real_sas
      - dataset_reconciliation_pass
      - dataset_reconciliation_not_simulated
      - results_reconciliation_pass
      - spec_data_pass

  - id: safety_adam
    name: Safety ADaM datasets ADAE/ADEX/ADLB
    owner: statistical_programming
    gate: G04
    risk_tier: high
    decision_impact: "Safety summaries, exposure context, adverse-event interpretation, and labeling-relevant review."
    traceability: "SDTM AE/EX/LB -> ADaM spec -> safety ADaM -> safety TFLs/reviewer guides"
    required_checks:
      - current_real_sas
      - dataset_reconciliation_pass
      - dataset_reconciliation_not_simulated
      - spec_data_pass

  - id: response_adam
    name: ADRS response analysis dataset
    owner: statistical_programming
    gate: G04
    risk_tier: high
    decision_impact: "Response endpoint interpretation and responder evidence."
    traceability: "SDTM response source -> ADaM spec -> ADRS -> response outputs"
    required_checks:
      - current_real_sas
      - dataset_reconciliation_pass
      - dataset_reconciliation_not_simulated
      - spec_data_pass

  - id: tfl_primary_secondary
    name: Primary and secondary TFL outputs
    owner: statistical_programming
    gate: G05
    risk_tier: critical
    decision_impact: "Reviewer-facing efficacy/safety results."
    traceability: "ADaM -> TFL programs -> output index/hash binding -> ADRG/CSR"
    required_checks:
      - tfl_index_pass
      - ctq_traceability_pass
      - results_reconciliation_pass
      - forest_reconciliation_pass
      - cbzp_bridge_pass

  - id: metadata_package
    name: ADaM/SDTM metadata package
    owner: standards_metadata
    gate: G03
    risk_tier: critical
    decision_impact: "Controls reviewer ability to understand, navigate, and reproduce submitted datasets."
    traceability: "specification -> Define-XML/ARM/controlled terminology -> data/reviewer guides"
    required_checks:
      - spec_define_pass
      - spec_data_pass
      - ctq_traceability_pass
      - metadata_control_pass

  - id: reviewer_explanation
    name: Reviewer guides and traceability narrative
    owner: medical_writing_regulatory
    gate: G07
    risk_tier: high
    decision_impact: "Explains methods, limitations, conformance findings, and review path."
    traceability: "all upstream evidence -> ADRG/SDRG/BDRG/SDSP/traceability matrix"
    required_files:
      - 07_reviewer_explanation/guides/ADRG.md
      - 07_reviewer_explanation/guides/SDRG.md
      - 07_reviewer_explanation/guides/BDRG.md
      - 07_reviewer_explanation/guides/SDSP.md
      - 07_reviewer_explanation/guides/TRACEABILITY_MATRIX.md
    required_checks:
      - ctq_traceability_pass

  - id: simulation_methods_evaluation
    name: Data-free simulation operating-characteristic evidence
    owner: statistical_programming_qc
    gate: G06
    risk_tier: high
    decision_impact: "Could misstate method behavior or Monte Carlo precision if assumptions, implementation, accounting, or scope boundaries drift."
    traceability: "current-practice research -> frozen YAML MAP/estimand -> simulation engine -> independent verifier -> authoritative aggregate JSON -> generated MAP/report -> Module 5-style annex"
    required_files:
      - docs/SIMULATION_PRECISION_RESEARCH.md
      - config/simulation_protocol.yaml
      - platform/simulation_precision.py
      - platform/check_simulation_evidence.py
      - tests/test_simulation_precision.py
      - tests/test_simulation_evidence.py
      - tests/test_simulation_report.py
      - 07_reviewer_explanation/simulation_model_analysis_plan.md
      - 07_reviewer_explanation/simulation_report.md
    required_checks:
      - simulation_execution_pass
      - simulation_precision_pass
      - simulation_design_check_pass
      - simulation_boundary_preserved

  - id: log_cleanliness
    name: SAS/R log cleanliness gate
    owner: qc_validation
    gate: G06
    risk_tier: high
    decision_impact: "Prevents unapproved execution-log warnings or data-conversion notes from being hidden beneath passing reconciliation telemetry."
    traceability: "program execution -> SAS/R logs -> log-cleanliness evidence -> QC signoff/release manifest"
    required_checks:
      - log_cleanliness_pass

  - id: platform_release_controls
    name: Platform execution and release controls
    owner: platform_release
    gate: G09
    risk_tier: critical
    decision_impact: "Determines whether the current run can be treated as a release candidate."
    traceability: "pipeline execution -> telemetry -> release checklist -> package materialization"
    required_checks:
      - pipeline_green
      - current_real_sas
      - dataset_reconciliation_not_simulated
      - log_cleanliness_pass
