# TROPIC controlled TFL output catalog.
#
# Purpose: make the output universe an explicit control object — not an accidental
# intersection of "whatever tfl_generation.R wrote" and "whatever SAP Table 21 lists".
#
# Authority hierarchy:
#   1. 02_specifications/sap/TROPIC_SAP_v4.0_industry_grade.docx — scientific/programming SAP (locked for remediation)
#   2. This file — controlled programming *release scope* for the current pipeline product
#   3. platform/build_tfl_output_index.py CATALOG — physical index of in-scope outputs
#
# Full SAP Appendix D / historical Table-21-class IDs remain listed under sap_full_catalog
# for gap control. Deferred IDs are not release defects of the controlled scope; they are
# explicit non-commitments until implemented under approved shells + QC.

version: 1
study: TROPIC-NCT00417079
generated_for: "controlled programming release scope (portfolio / demonstration pipeline)"
sap_authority: 02_specifications/sap/TROPIC_SAP_v4.0_industry_grade.docx
lock_memo: 06_qc_evidence/audit/SAP_LOCK_REVIEW_MEMO.md
index_program: platform/build_tfl_output_index.py
generator_program: 05_outputs/tfl/tfl_generation.R

policy:
  doctrine: |
    No output is in-scope unless listed under controlled_in_scope.
    No SAP full-catalog ID may be silently missing: it is either in-scope and produced,
    or deferred with a disposition.
    Produced IDs absent from the historical SAP ID list require an approved_extension disposition.
  comparative_cbzp: synthetic_or_reconstructed_demonstration_only
  listings: |
    No clinical listing is currently in controlled scope. Placeholder listings are prohibited
    (F-004 closed by removal). Future listings require approved shells + source lineage + QC.

