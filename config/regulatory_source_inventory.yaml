schema_version: "1.0"
inventory_id: "TROPIC-OFFICIAL-SOURCES-2026-08-15"
assessed_on: "2026-08-15"
owner: "TROPIC repository maintainers"

# This is a scoped source inventory, not a claim that every FDA, ICH, CDISC,
# or national-regulator document has been reviewed.  The official FDA and ICH
# indexes are the universe boundary; entries below are the sources selected as
# relevant to this repository's drug-clinical-data, statistics, simulation,
# computerized-system, and eCTD surfaces.
scope:
  product_class: "controlled_clinical_submission_simulation"
  intended_use: "interview and technical-review demonstration"
  included_surfaces:
    - "clinical data standards and reviewer documentation"
    - "estimands, statistical design, and simulation operating characteristics"
    - "electronic records and computerized-system boundaries"
    - "CTD/eCTD and submission-package mechanics"
    - "risk-based quality and traceability"
  excluded_surfaces:
    - "CMC/GMP and manufacturing quality systems"
    - "nonclinical/pharmacology guidance"
    - "indication-specific clinical guidance"
    - "post-approval pharmacovigilance and real-world evidence"
    - "medical-device quality-system software"
  boundary: >-
    This inventory supports a conservative repository readiness review. It is
    not legal advice, a center-specific filing determination, sponsor SOP
    approval, or evidence that this repository is a qualified regulated system.

status_definitions:
  APPLICABLE: "Directly informs a current repository control or artifact."
  PARTIALLY_APPLICABLE: "Relevant boundary or gap, but the repository is not a live sponsor system."
  OUT_OF_SCOPE: "Official source reviewed and deliberately excluded for the current intended use."
  WATCH_NOT_FINAL: "Relevant direction exists, but the cited document is draft, under development, or not final."
  NEEDS_OWNER_CONFIRMATION: "Depends on center, application, data-rights, or sponsor decisions not present here."

