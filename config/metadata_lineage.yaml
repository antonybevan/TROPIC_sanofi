version: 1
owner: biometrics_metadata
purpose: >
  Govern ADaM variable predecessor documentation and sponsor-defined
  controlled-terminology dispositions used by metadata control gates.

controlled_terminology_dispositions:
  CL.TRT01PN:
    status: sponsor_defined
    applies_to:
      - ADSL.TRT01PN
      - ADEX.TRT01PN
      - ADTTE.TRT01PN
    rationale: >
      Numeric treatment ordering used for analysis, sorting, and reconciliation.
      Treatment text values remain reviewer-facing in TRT01P/TRT01A/TRTA.
    terms:
      "1": Cabazitaxel + Prednisone
      "2": Mitoxantrone + Prednisone
    regulatory_position: >
      Internal numeric analysis codelist. Not asserted as CDISC controlled
      terminology because no matching CDISC codelist is expected for this
      sponsor-specific arm numbering.
  CL.CNSR:
    status: sponsor_defined
    applies_to:
      - ADTTE.CNSR
    rationale: >
      Time-to-event censoring indicator where 0 denotes event and 1 denotes
      censored. The values support ADTTE derivations and SAS/R reconciliation.
    terms:
      "0": Event
      "1": Censored
    regulatory_position: >
      Internal ADTTE analysis codelist. Semantics are documented in the ADTTE
      methods and reviewer-facing traceability rather than submitted as a CDISC
      controlled-terminology codelist.

predecessor_rules:
  common:
    STUDYID: Protocol identifier from config/study_config.yaml and SDTM study domain records.
    USUBJID: SDTM.DM.USUBJID.
    SUBJID: SDTM.DM.SUBJID.
    SITEID: SDTM.DM.SITEID.
    TRT01P: Randomized/planned treatment assignment from SDTM.DM.ARM and config/study_config.yaml treatment map.
    TRT01PN: Numeric planned treatment assignment from config/study_config.yaml treatment map.
    TRT01A: Actual treatment assignment from first non-missing SDTM.EX exposure record and config/study_config.yaml treatment map.
    TRT01AN: Numeric actual treatment assignment from first non-missing SDTM.EX exposure record and config/study_config.yaml treatment map.
    TRTA: Actual treatment assignment inherited from ADSL.TRT01A.
    TRTAN: Numeric actual treatment assignment inherited from ADSL.TRT01AN.
    TRTSDT: Treatment start date inherited from ADSL.TRTSDT unless defined directly for ADSL.
    PARAMCD: Analysis parameter code from dataset-specific parameter derivation and source test/category.
    PARAM: Analysis parameter label from dataset-specific parameter derivation and source test/category.
    PARAMN: Numeric parameter ordering from dataset-specific parameter map.
    PARCAT1: Analysis parameter category from dataset-specific parameter map.
    AVISIT: Analysis visit derived from source visit/date and dataset-specific visit window rules.
    AVISITN: Numeric analysis visit derived from AVISIT and dataset-specific visit ordering.
    ADT: Analysis date derived from the source assessment date.
    ADY: Analysis relative day derived from ADT and ADSL.TRTSDT.
    ASTDT: Analysis start date derived from source start date.
    AENDT: Analysis end date derived from source end date.
    ASTDY: Analysis start relative day derived from ASTDT and ADSL.TRTSDT.
    AENDY: Analysis end relative day derived from AENDT and ADSL.TRTSDT.
    AVAL: Analysis value derived from dataset-specific source result/value fields.
    AVALC: Character analysis value derived from dataset-specific source result/value fields.
    ANL01FL: Analysis inclusion flag derived from dataset-specific record-selection rules.

  dataset_defaults:
    ADSL: SDTM.DM, SDTM.EX, SDTM.DS, SDTM.VS, SDTM.LB, SDTM.RS/LS, and config/study_config.yaml subject-level rules.
    ADEX: SDTM.EX plus ADSL treatment and subject-level attributes.
    ADCM: SDTM.CM plus ADSL treatment and subject-level attributes.
    ADAE: SDTM.AE/SUPPAE plus ADSL treatment and subject-level attributes.
    ADLB: SDTM.LB plus ADSL treatment, baseline, and subject-level attributes.
    ADRS: SDTM.RS/TU/TR/LS response assessments plus ADSL treatment and subject-level attributes.
    ADTTE: ADSL subject-level attributes plus SDTM.DS, SDTM.RS/LS, SDTM.AE, and death/progression source dates by PARAMCD.

  overrides:
    ADSL:
      AGE: SDTM.DM.AGE.
      AGEGR1: Derived age group from SDTM.DM.AGE and protocol age group definitions.
      AGEGR1N: Numeric age group from AGEGR1.
      RACE: SDTM.DM.RACE.
      ETHNIC: SDTM.DM.ETHNIC.
      SEX: SDTM.DM.SEX.
      RANDDT: Randomization date from SDTM.DM.RFSTDTC or randomization source record.
      TRTSDT: First exposure start date from SDTM.EX.EXSTDTC.
      TRTEDT: Last exposure end date from SDTM.EX.EXENDTC.
      TRTDURD: Derived from ADSL.TRTSDT and ADSL.TRTEDT.
      ITTFL: Population flag from randomized subject records and protocol population rules.
      SAFFL: Population flag from treated subject records using SDTM.EX exposure evidence.
      PPROTFL: Protocol/per-protocol eligibility source records and protocol deviation review.
      DTHFL: Death flag from SDTM.DM.DTHFL and disposition/death records.
      DTHDT: Death date from SDTM.DM.DTHDTC or disposition/death records.
      DTHCAUS: Death cause from disposition/death source records.
      LSTALVDT: Last known alive date from maximum non-death contact/assessment date across SDTM source domains.
      ECOGBL: Baseline ECOG from SDTM.QS/VS assessment source before treatment start.
      MEASDISF: Measurable disease flag from baseline tumor/response source assessments.
      VISCFL: Visceral disease flag from baseline lesion source assessments.
      PAINBL: Baseline pain score from pain assessment source before treatment start.
      PSABL: Baseline PSA from SDTM.LB prostate-specific antigen records.
      ALPBL: Baseline alkaline phosphatase from SDTM.LB records.
      ALBBL: Baseline albumin from SDTM.LB records.
      LDHBL: Baseline lactate dehydrogenase from SDTM.LB records.
      HGBBL: Baseline hemoglobin from SDTM.LB records.
      DOCPROG: Investigator-assessed progression source records.
      DOCRESP: Investigator-assessed response source records.
      ECOGBLIF: Imputation flag derived from ECOGBL source availability and baseline window rules.
      PSABLIF: Imputation flag derived from PSABL source availability and baseline window rules.
      ALPBLIF: Imputation flag derived from ALPBL source availability and baseline window rules.
      HGBBLIF: Imputation flag derived from HGBBL source availability and baseline window rules.
      ALBBLIF: Imputation flag derived from ALBBL source availability and baseline window rules.
      LDHBLIF: Imputation flag derived from LDHBL source availability and baseline window rules.
    ADEX:
      AVAL: Numeric exposure analysis value from SDTM.EX dose/duration fields by PARAMCD.
      AVALC: Character exposure analysis value from SDTM.EX dose/duration fields by PARAMCD.
      PARAMN: Numeric parameter ordering from ADEX.PARAMCD.
      AVISITN: Numeric analysis visit derived from ADEX.AVISIT and SDTM.EX sequence/date.
    ADAE:
      ATOXGR: Numeric toxicity grade derived from SDTM.AE toxicity grade/severity source fields.
      TRTEMFL: Treatment-emergent flag derived from ADAE.ASTDT and ADSL.TRTSDT.
      ADURN: Adverse event duration derived from ADAE.ASTDT and ADAE.AENDT.
      ADURU: Duration unit assigned by adverse-event derivation rule.
    ADLB:
      AVAL: Numeric lab analysis value from SDTM.LB.LBSTRESN.
      AVALC: Character lab analysis value from SDTM.LB.LBSTRESC.
      ATOXGR: Analysis toxicity grade derived from SDTM.LB result, normal range, and grading rules.
      BASE: Baseline numeric value selected from pre-treatment ADLB.AVAL records.
      BASEC: Baseline character value selected from pre-treatment ADLB.AVALC records.
      BTOXGR: Baseline toxicity grade selected from pre-treatment records.
      CHG: Change from baseline derived as ADLB.AVAL minus ADLB.BASE.
      PCHG: Percent change from baseline derived as ADLB.CHG divided by ADLB.BASE.
      BASEFL: Baseline flag derived from pre-treatment record-selection rules.
      ADT: Analysis date from SDTM.LB.LBDTC.
    ADRS:
      AVALC: Character response result from response source assessments and response derivation rules.
      AVAL: Numeric response category from ADRS.AVALC response ordering map.
    ADTTE:
      ITTFL: Inherited from ADSL.ITTFL.
      SAFFL: Inherited from ADSL.SAFFL.
      PARAMN: Numeric parameter ordering from ADTTE.PARAMCD.
      PARCAT1: Time-to-event category from ADTTE.PARAMCD.
      CNSR: Censoring indicator derived from event/censor source dates by ADTTE.PARAMCD.
      AVAL: Time-to-event duration derived from ADTTE.STARTDT, ADTTE.ADT, and ADTTE.AVALU.
      AVALU: Time-to-event unit assigned by ADTTE parameter derivation.

method_expansion:
  assignments:
    ADSL.DTHDT: MT.DTHDT
    ADSL.LSTALVDT: MT.LSTALVDT
    ADSL.ECOGBLIF: MT.ECOGBLIF
    ADSL.PSABLIF: MT.PSABLIF
    ADSL.ALPBLIF: MT.ALPBLIF
    ADSL.HGBBLIF: MT.HGBBLIF
    ADSL.ALBBLIF: MT.ALBBLIF
    ADSL.LDHBLIF: MT.LDHBLIF
    ADEX.AVAL: MT.ADEX_AVAL
    ADEX.AVALC: MT.ADEX_AVALC
    ADEX.PARAMN: MT.ADEX_PARAMN
    ADEX.AVISITN: MT.ADEX_AVISITN
    ADCM.ASTDT: MT.ADCM_ASTDT
    ADCM.AENDT: MT.ADCM_AENDT
    ADCM.ASTDY: MT.ADCM_ASTDY
    ADAE.ATOXGR: MT.ADAE_ATOXGR
    ADLB.AVAL: MT.ADLB_AVAL
    ADLB.AVALC: MT.ADLB_AVALC
    ADLB.ATOXGR: MT.ADLB_ATOXGR
    ADLB.BASE: MT.ADLB_BASE
    ADLB.BASEC: MT.ADLB_BASEC
    ADLB.CHG: MT.ADLB_CHG
    ADLB.PCHG: MT.ADLB_PCHG
    ADLB.BASEFL: MT.ADLB_BASEFL
    ADLB.ADT: MT.ADLB_ADT
    ADRS.AVALC: MT.ADRS_AVALC
    ADRS.AVAL: MT.ADRS_AVAL
    ADTTE.ITTFL: MT.ADTTE_ITTFL
    ADTTE.SAFFL: MT.ADTTE_SAFFL
    ADTTE.PARAMN: MT.ADTTE_PARAMN
    ADTTE.PARCAT1: MT.ADTTE_PARCAT1
    ADTTE.AVALU: MT.ADTTE_AVALU

  definitions:
    MT.DTHDT: Death date derived from SDTM.DM.DTHDTC or disposition/death records.
    MT.LSTALVDT: Last known alive date derived as the maximum non-death contact or assessment date across source domains.
    MT.ECOGBLIF: Baseline ECOG imputation flag derived from ECOGBL source availability and baseline window rules.
    MT.PSABLIF: Baseline PSA imputation flag derived from PSABL source availability and baseline window rules.
    MT.ALPBLIF: Baseline alkaline phosphatase imputation flag derived from ALPBL source availability and baseline window rules.
    MT.HGBBLIF: Baseline hemoglobin imputation flag derived from HGBBL source availability and baseline window rules.
    MT.ALBBLIF: Baseline albumin imputation flag derived from ALBBL source availability and baseline window rules.
    MT.LDHBLIF: Baseline lactate dehydrogenase imputation flag derived from LDHBL source availability and baseline window rules.
    MT.ADEX_AVAL: Numeric exposure analysis value derived from SDTM.EX dose, duration, or cycle records according to ADEX.PARAMCD.
    MT.ADEX_AVALC: Character exposure analysis value derived from SDTM.EX dose, duration, or cycle records according to ADEX.PARAMCD.
    MT.ADEX_PARAMN: Numeric ADEX parameter ordering derived from ADEX.PARAMCD.
    MT.ADEX_AVISITN: Numeric ADEX analysis visit derived from ADEX.AVISIT and SDTM.EX date or sequence ordering.
    MT.ADCM_ASTDT: Analysis medication start date derived from SDTM.CM.CMSTDTC.
    MT.ADCM_AENDT: Analysis medication end date derived from SDTM.CM.CMENDTC.
    MT.ADCM_ASTDY: Analysis medication start relative day derived from ADCM.ASTDT and ADSL.TRTSDT.
    MT.ADAE_ATOXGR: Numeric adverse-event toxicity grade derived from SDTM.AE toxicity grade or severity source fields.
    MT.ADLB_AVAL: Numeric laboratory analysis value derived from SDTM.LB.LBSTRESN after parameter-specific unit standardization.
    MT.ADLB_AVALC: Character laboratory analysis value derived from SDTM.LB.LBSTRESC.
    MT.ADLB_ATOXGR: Analysis toxicity grade derived from laboratory result, normal range, and grading rules.
    MT.ADLB_BASE: Baseline numeric value selected from the latest eligible pre-treatment ADLB.AVAL record.
    MT.ADLB_BASEC: Baseline character value selected from the latest eligible pre-treatment ADLB.AVALC record.
    MT.ADLB_CHG: Change from baseline calculated as ADLB.AVAL minus ADLB.BASE.
    MT.ADLB_PCHG: Percent change from baseline calculated as 100 times ADLB.CHG divided by ADLB.BASE.
    MT.ADLB_BASEFL: Baseline flag set on the selected eligible pre-treatment laboratory record.
    MT.ADLB_ADT: Analysis date derived from SDTM.LB.LBDTC.
    MT.ADRS_AVALC: Character response result derived from response source assessments and response derivation rules.
    MT.ADRS_AVAL: Numeric response category derived from ADRS.AVALC response ordering.
    MT.ADTTE_ITTFL: Intent-to-treat flag inherited from ADSL.ITTFL.
    MT.ADTTE_SAFFL: Safety population flag inherited from ADSL.SAFFL.
    MT.ADTTE_PARAMN: Numeric ADTTE parameter ordering derived from ADTTE.PARAMCD.
    MT.ADTTE_PARCAT1: Time-to-event parameter category derived from ADTTE.PARAMCD.
    MT.ADTTE_AVALU: Time-to-event unit assigned by ADTTE parameter derivation.

origin_overrides:
  ADCM.ASTDT: Derived
  ADCM.AENDT: Derived
  ADCM.ASTDY: Derived

method_dispositions:
  status: resolved_by_method_expansion
  rationale: >
    Derived-variable MethodOIDs are governed by method_expansion and applied to
    both the ADaM specification workbook and Define-XML so spec-to-define
    conformance remains controlled.
