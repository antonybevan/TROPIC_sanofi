# ==============================================================================
# config/study_manifest.yaml — pipeline STRUCTURE (governed control source).
#
# Companion to config/study_config.yaml: that file holds clinical PARAMETERS (thresholds,
# windows, imputation defaults); this file holds STRUCTURE — which datasets exist,
# which programs build/validate them, which keys reconcile them, and who the study
# is. The orchestrator (platform/cibuild.py), the cross-language reconciler
# (06_qc_evidence/reconciliation/cross_lang_audit.R) and the ODA TFL renderer
# (platform/_oda_render_tfl.py) all read this instead of hardcoding the list.
#
# Naming is ALMOST mechanical (A_<ds>_generation.sas / v_<ds>_validation.R) but has
# exceptions that cannot be derived (ADAE; BIMO produces the `clinsite` dataset), so
# the wiring is declared here explicitly rather than auto-discovered from filenames.
# ==============================================================================

study:
  id: "TROPIC-NCT00417079"
  code: "EFC6193 / XRP6258"
  title: "TROPIC"

# Reconciled ADaM (+ BIMO clinsite) datasets. List order IS the validation/build order.
# `keys` are the business keys cross_lang_audit.R aligns on. `parallel_group` marks the
# datasets cibuild.py validates concurrently as one contiguous fan-out batch; `order` is
# documentary. `val_stage` overrides the default "R <NAME> Validation" stage label.
datasets:
  - name: adsl
    keys: [USUBJID]
    sas: A_adsl_generation.sas
    val: v_adsl_validation.R
    order: 0                       # subject-level master; must precede the parallel batch
  - name: adex
    keys: [USUBJID, PARAMCD, AVISIT]
    sas: A_adex_generation.sas
    val: v_adex_validation.R
    parallel_group: 1
  - name: adcm
    keys: [USUBJID, ASTDT, CMDECOD]
    sas: A_adcm_generation.sas
    val: v_adcm_validation.R
    parallel_group: 1
  - name: adae
    keys: [USUBJID, AESEQ]         # unique within-subject key (positional parity)
    sas: A_adae_io_respec.sas      # exception: not A_adae_generation.sas
    val: v_adae_io_validation.R    # exception: not v_adae_validation.R
    parallel_group: 1
  - name: adlb
    keys: [USUBJID, PARAMCD, AVISITN, LBDY]
    sas: A_adlb_generation.sas
    val: v_adlb_validation.R
    parallel_group: 1
  - name: adrs
    keys: [USUBJID, PARAMCD, AVISIT]
    sas: A_adrs_generation.sas
    val: v_adrs_validation.R
    parallel_group: 1
  - name: adtte
    keys: [USUBJID, PARAMCD]
    sas: A_adtte_generation.sas
    val: v_adtte_validation.R
    order: 2
    results_recon: { dataset: adtte, arm: MP, proc: lifetest }  # M-1 numerical results recon
  - name: clinsite
    keys: [STUDYID, SITEID]
    sas: B_bimo_generation.sas       # exception: BIMO program...
    val: v_bimo_validation.R         # ...validated by v_bimo_validation.R...
    val_stage: "R BIMO Validation"   # ...stage labelled BIMO, but the produced dataset is `clinsite`
    order: 3

# Fixed, non-per-dataset stages, consumed by cibuild.py build_stages(). List order is
# execution order. `runner` selects the invocation style: logrx (Rscript -e
# logrx::axecute, the default for R), rscript (bare Rscript), or python. `gated: true`
# marks the three stages whose post-execution QC gates live in run_single_stage().
infrastructure_stages:
  pre:
    # G00/G02 are first-class runtime locks (phase 2): governance + analysis specification
    # must pass before any derivation stage is treated as in-scope for a release claim.
    - { name: "Governance Scope Lock (G00)", script: "platform/check_gate_g00_governance.py", runner: python, gated: true }
    - { name: "Analysis Specification Lock (G02)", script: "platform/check_gate_g02_specification.py", runner: python, gated: true }
    - { name: "ADaM Spec Label/Order Artifacts", script: "platform/gen_adam_labels.R", runner: rscript }
    - { name: "Real SDTM Staging Ingest", script: "04_analysis_datasets/programs/r/v_staging_ingest.R", runner: logrx }
    - { name: "R SDTM Validation",        script: "04_analysis_datasets/programs/r/v_sdtm_validation.R", runner: logrx }
  post:
    - { name: "Cross-Language Audit Reconcile",              script: "06_qc_evidence/reconciliation/cross_lang_audit.R",     runner: logrx,   gated: true }
    # Third-engine (pharmaverse admiral) track for T1 critical core: ADSL + ADTTE OS/PFS.
    # Requires staging SDTM, R ADRS/ADCM validation XPTs (event anchors), and SAS *_prod.xpt
    # for reconciliation. Runs after cross-lang audit so production XPTs are known-good.
    # Scoped core only (see admiral_reconcile.R / RISK_BASED_VALIDATION.md T1).
    - { name: "Admiral ADSL Re-derivation",                 script: "04_analysis_datasets/programs/r/admiral_adsl.R",           runner: rscript }
    - { name: "Admiral ADTTE Re-derivation (OS/PFS)",       script: "04_analysis_datasets/programs/r/admiral_adtte.R",          runner: rscript }
    - { name: "Admiral Core Reconciliation",               script: "06_qc_evidence/reconciliation/admiral_reconcile.R",    runner: rscript, gated: true }
    # Synthetic comparator bridge integrity. The SAS production track reads <dom>_cbzp.xpt and the
    # R reporting track reads <dom>_cbzp.rds; this step fails the build unless the .xpt is the current
    # deterministic export of the .rds, so both tracks provably consume an identical comparator cohort.
    # Non-gated: the script's own non-zero exit code gates the build. Runs before TFL compilation so a
    # drifted bridge is caught before any figure is rendered from it.
    - { name: "Synthetic Comparator Bridge Parity",       script: "01_source_data/check_cbzp_bridge.R",        runner: rscript }
    - { name: "Efficacy & Safety TFL Suite Compilation",     script: "05_outputs/tfl/tfl_generation.R",                  runner: rscript, gated: true }
    - { name: "Numerical Results Reconciliation (SAS vs R)", script: "06_qc_evidence/reconciliation/results_reconcile.R",    runner: logrx,   gated: true }
    # Figure-driving statistics gate: numerically reconciles the F-12-1 forest subgroup HRs
    # (SAS PROC PHREG vs R coxph). Catches SAS-figure-code divergence from R (e.g. a dropped
    # subgroup or wrong AVISIT filter) that the dataset/results gates above do not see.
    # Non-gated: own exit code gates it; absent forest CSV -> not_available, exit 0.
    - { name: "Forest-HR Reconciliation (SAS vs R)",         script: "06_qc_evidence/reconciliation/forest_reconcile.R",    runner: rscript }
    # Figure-driving data gate (KM/waterfall/swimmer/ER exports from SAS TFL track).
    # Non-gated; absent SAS figure CSVs -> not_available, exit 0 (see script header).
    - { name: "Figure-Data Reconciliation (SAS vs R)",       script: "06_qc_evidence/reconciliation/figure_data_reconcile.R", runner: rscript }
    - { name: "ADaM Spec to Define Conformance",             script: "03_metadata/define/check_define_conformance.R", runner: rscript }
    - { name: "ADaM Spec to Data Conformance",               script: "04_analysis_datasets/programs/r/spec_data_checks.R",       runner: rscript }
    # G07 reviewer package lock: ADRG/SDRG/BDRG + residual/claim pointers must hold before
    # Dataset-JSON/ARS/USDM/eCTD materialization is treated as reviewer-facing packaging.
    - { name: "Reviewer Package Lock (G07)",                 script: "platform/check_gate_g07_reviewer_package.py", runner: python, gated: true }
    # Modern machine-readable export layer. Non-gated: each generator's own exit code gates it
    # (non-zero -> sys.exit(1)); they run after the data/spec gates and before eCTD packaging.
    - { name: "Dataset-JSON Export (v1.1)",                  script: "platform/export_datasetjson.py",       runner: python }
    - { name: "Analysis Results Standard (ARS v1.0)",        script: "platform/build_ars.py",                runner: python }
    - { name: "USDM Study Definition (v3.0)",                script: "platform/build_usdm.py",               runner: python }
    - { name: "eCTD Final Package",                          script: "platform/package_ectd.py",             runner: python }
    # eCTD submission backbone (sequence 0000): build the index/STF/regional layer over
    # 08_submission_package/m5/
    # deliverables, then materialize the sequence and re-verify every leaf MD5. Previously these
    # ran outside the DAG/CI and drifted from the Module 5 package (audit M-5); now gated by their own exit codes.
    - { name: "eCTD Backbone + STF (sequence 0000)",         script: "platform/build_ectd_backbone.py",      runner: python }
    - { name: "Materialize eCTD Sequence",                   script: "platform/materialize_ectd.py",         runner: python }
    - { name: "Log Cleanliness Gate",                        script: "platform/check_log_cleanliness.py",   runner: python }
    - { name: "Release Run Manifest Binding",                script: "platform/build_release_run_manifest.py", runner: python }
