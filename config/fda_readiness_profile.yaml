    checked_on: "2026-08-15"
    url: "https://www.fda.gov/drugs/electronic-regulatory-submission-and-review/submit-standardized-data-sample-fda"
  - id: "FDA-CITD"
    authority: "FDA"
    title: "Complex Innovative Trial Design Meeting Program"
    version: "current page checked 2026-08-15"
    checked_on: "2026-08-15"
    url: "https://www.fda.gov/drugs/development-resources/complex-innovative-trial-design-meeting-program"
  - id: "FDA-MODEL-DATA"
    authority: "FDA"
    title: "Model | Data Format"
    version: "current page checked 2026-08-15"
