# Status is an assessed state, not a generated green badge. PASS means the
# local evidence is present for this scope; PARTIAL means the evidence exists
# but is bounded; BLOCKED/NOT_QUALIFIED are intentional release blockers.
controls:
  - id: "GOV-001"
    domain: "governance"
    expectation: "The product claim, intended use, and prohibited regulatory claims are explicit before release."
    status: "PASS"
    evidence:
      - path: "docs/PRODUCT_CLAIM.md"
        required: true
      - path: "docs/QUALITY_SYSTEM_BOUNDARY.md"
        required: true
      - path: "config/regulatory_baseline.yaml"
        required: true
    owner_action: "Reapprove the claim if the intended use or data boundary changes."

  - id: "GOV-002"
    domain: "governance"
    expectation: "The statistical objective, estimand, scenario assumptions, and precision acceptance criteria are prospective and frozen."
    status: "PASS"
    evidence:
      - path: "config/simulation_protocol.yaml"
        required: true
      - path: "07_reviewer_explanation/simulation_model_analysis_plan.md"
        required: true
      - path: "07_reviewer_explanation/simulation_report.md"
        required: true
    owner_action: "Record an approved change-control decision before modifying the frozen protocol."

  - id: "GOV-003"
    domain: "governance"
    expectation: "The release is reproducible, hash-bound, and independently re-checkable from a clean checkout."
    status: "PARTIAL"
    evidence:
      - path: "scripts/verify_release.py"
        required: true
      - path: "platform/check_simulation_evidence.py"
        required: true
      - path: "docs/RELEASE_RUN_MANIFEST.md"
        required: true
    owner_action: "Re-run the genuine SAS/ODA production path and refresh the controlled seal before any release claim."

  - id: "STAT-001"
    domain: "statistics"
    expectation: "The estimand and intercurrent-event strategy are explicit, and sensitivity analysis is tied to the question of interest."
    status: "PARTIAL"
    evidence:
      - path: "07_reviewer_explanation/simulation_model_analysis_plan.md"
        required: true
      - path: "02_specifications/sap/TROPIC_SAP_v4.0_industry_grade.docx"
        required: true
      - path: "07_reviewer_explanation/analysis_report.md"
        required: true
    owner_action: "For a real study, obtain statistician and clinical approval of the final E9(R1) estimand and sensitivity set."

  - id: "STAT-002"
    domain: "simulation"
    expectation: "A structured simulation protocol covers plausible/null/stress scenarios, design operating characteristics, and Monte Carlo precision."
    status: "PASS"
    evidence:
      - path: "config/simulation_protocol.yaml"
        required: true
      - path: "platform/simulation_operating_characteristics/simulation_oc_status.json"
        required: true
      - path: "platform/simulation_operating_characteristics/scenario_results.csv"
        required: true
      - path: "platform/simulation_operating_characteristics/representative_trials.json"
        required: true
    owner_action: "Add sponsor-approved thresholds and scenario evidence before using simulation results for design decisions."

  - id: "STAT-003"
    domain: "simulation"
    expectation: "Numerical results have an analytic benchmark, complete replicate accounting, deterministic seeds, independent verification, and an explicit qualification boundary."
    status: "PASS"
    evidence:
      - path: "platform/simulation_precision.py"
        required: true
      - path: "platform/check_simulation_evidence.py"
        required: true
      - path: "tests/test_simulation_evidence.py"
        required: true
      - path: "06_qc_evidence/audit/SIMULATION_PRECISION_IMPLEMENTATION_REPORT_2026-08-14.md"
        required: true
    owner_action: "Prespecify and implement correlated endpoints, missing-data mechanisms, outer-loop parameter uncertainty, and an independent engine if the intended question requires them."

  - id: "STAT-004"
    domain: "simulation"
    expectation: "Model risk is qualified against the intended use, including joint dependence, missingness, estimator reproduction, and independent validation."
    status: "NOT_QUALIFIED"
    evidence:
      - path: "docs/FDA_READINESS_RESEARCH_2026-08-15.md"
        required: true
    owner_action: "Do not use this simulation as MIDD, confirmatory, filing, or patient-level evidence; design a qualification study before expanding scope."

  - id: "DATA-001"
    domain: "data_and_standards"
    expectation: "Standardized datasets, Define-XML, reviewer guides, and source-to-analysis traceability are co-located and explain known differences."
    status: "PARTIAL"
    evidence:
      - path: "03_metadata/define/define.xml"
        required: true
      - path: "03_metadata/define/define_sdtm.xml"
        required: true
      - path: "07_reviewer_explanation/guides/ADRG.md"
        required: true
      - path: "07_reviewer_explanation/guides/SDRG.md"
        required: true
      - path: "07_reviewer_explanation/guides/TRACEABILITY_MATRIX.md"
        required: true
    owner_action: "Run the applicable FDA/CDISC standards and controlled-terminology checks on the authorized data-bearing package and disposition all findings."

  - id: "DATA-002"
    domain: "data_and_standards"
    expectation: "A validator report, run record, and reviewer-facing explanation exist for conformance findings."
    status: "PARTIAL"
    evidence:
      - path: "06_qc_evidence/conformance/p21_adam_summary.json"
        required: true
      - path: "06_qc_evidence/conformance/p21_adam_runrecord.md"
        required: true
      - path: "06_qc_evidence/audit/run_records/SUBMISSION_STANDARDS_REMEDIATION.md"
        required: true
    owner_action: "Resolve or formally accept open findings with sponsor ownership; confirm tool/version compatibility and licensed-use status."

  - id: "SYSTEM-001"
    domain: "computerized_systems"
    expectation: "Systems and interfaces are fit-for-purpose, risk-based validated, access-controlled, backed up, change-controlled, and auditable."
    status: "NOT_QUALIFIED"
    evidence:
      - path: "docs/QUALITY_SYSTEM_BOUNDARY.md"
        required: true
      - path: "SECURITY.md"
        required: true
    owner_action: "For regulated use, execute an approved CSV/CSA lifecycle with requirements, IQ/OQ/PQ or equivalent risk-based evidence, audit-trail review, access review, backup/restore, and change control."

  - id: "SUB-001"
    domain: "submission"
    expectation: "The eCTD-style package has correct leaf classification, reviewer-guide placement, metadata, links, and current center-specific standards."
    status: "PARTIAL"
    evidence:
      - path: "08_submission_package/README.md"
        required: true
      - path: "08_submission_package/ectd/0000/index.xml"
        required: true
      - path: "08_submission_package/m5/datasets/tropic/analysis/adam/adrg.pdf"
        required: true
      - path: "08_submission_package/m5/datasets/tropic/tabulations/sdtm/csdrg.pdf"
        required: true
    owner_action: "Confirm the relevant center, application type, eCTD version, validation criteria, gateway rules, and sample-submission expectations immediately before filing."

  - id: "SUB-002"
    domain: "release"
    expectation: "The final release seal is green after the complete authorized production run, with no stale source/artifact hashes."
    status: "BLOCKED"
    evidence:
      - path: "scripts/verify_release.py"
        required: true
      - path: "docs/RELEASE_NOTE_v0.3.0-clinical-simulation.md"
        required: true
    owner_action: "Run the real SAS/ODA path, refresh all controlled manifests and package artifacts, and obtain owner/statistical/medical review before shipping."

  - id: "QC-001"
    domain: "quality_control"
    expectation: "Critical outputs have risk-based independent verification and documented reviewer disposition."
    status: "NOT_QUALIFIED"
    evidence:
      - path: "config/validation_strategy.yaml"
        required: true
      - path: "06_qc_evidence/audit/FINDINGS_DISPOSITION_BOARD.md"
        required: true
    owner_action: "For a regulated submission, assign independent QC reviewers outside the authoring chain and capture approvals in the governed quality system."

  - id: "RIGHTS-001"
    domain: "data_rights"
    expectation: "Data, standards, software, and third-party report redistribution rights are explicit."
    status: "PARTIAL"
    evidence:
      - path: "docs/LICENSING.md"
        required: true
      - path: "00_governance/REPRODUCIBILITY.md"
        required: true
    owner_action: "Obtain written sponsor/data-owner and vendor permissions for any external or filing use; rotate local credentials before sharing a working copy."
