    authority: "FDA"
    title: "Electronic Common Technical Document (eCTD)"
    version: "current center/sequence version must be confirmed per filing"
    checked_on: "2026-08-15"
    url: "https://www.fda.gov/drugs/electronic-regulatory-submission-and-review/electronic-common-technical-document-ectd"
  - id: "FDA-ECTD-322"
    authority: "FDA"
    title: "eCTD v3.2.2 submission standards and validation criteria"
    version: "current page checked 2026-08-15"
    checked_on: "2026-08-15"
    url: "https://www.fda.gov/drugs/electronic-regulatory-submission-and-review/ectd-submission-standards-ectd-v322-and-regional-m1"
  - id: "FDA-STANDARDIZED-DATA-SAMPLE"
    authority: "FDA"
