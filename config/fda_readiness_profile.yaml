schema_version: "1.0"
profile_id: "TROPIC-FDA-READINESS-001"
assessed_on: "2026-08-15"
profile_owner: "TROPIC repository maintainers"

# This is a readiness evidence map, not an assertion that the repository is a
# regulatory submission or that its computerized systems are Part 11 validated.
# The checker intentionally permits an informative report with blockers; --strict
# is the go/no-go mode and must remain red until the named owner actions are done.
scope:
  product_class: "controlled_clinical_submission_simulation"
  intended_use: "interview and technical-review demonstration"
  release_claim: "NOT_FOR_REGULATORY_SUBMISSION"
  clinical_claim: "No confirmatory or patient-level efficacy claim"
  strict_gate_policy: "BLOCK_ON_BLOCKED_OR_NOT_QUALIFIED"

sources:
  - id: "FDA-TCG-2026"
    authority: "FDA"
    title: "Study Data Technical Conformance Guide"
    version: "June 2026"
    checked_on: "2026-08-15"
