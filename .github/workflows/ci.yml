name: TROPIC Clinical Pipeline CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # Path A seal re-check: no SAS, no patient data, no renv.
  # Proves committed seals + claim docs still pass scripts/verify_release.py.
  path-a-seal-verify:
    name: Path A seal verify (verify_release)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Path A release verification
      run: |
        # WS-7 release gate: re-check sealed control JSONs, product claim, findings.
        # Does not re-run ODA/SAS. Exit non-zero fails CI.
        python3 scripts/verify_release.py
        # shell wrapper parity
        bash scripts/verify_release.sh

    - name: Test release-seal verifier
      run: python3 tests/test_verify_release.py

  validate:
    name: Run Tests & Conformance Gates
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: 'release'

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxml2-dev libssl-dev libcurl4-openssl-dev libxml2-utils poppler-utils

    - name: Cache renv packages
      uses: actions/cache@v5
      with:
        path: ~/.cache/R/renv
        key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
        restore-keys: |
          ${{ runner.os }}-renv-

    - name: Restore renv environment
      run: |
        Rscript -e "install.packages('renv', repos='https://cloud.r-project.org')"
        Rscript -e "renv::restore()"

    - name: Lint R sources (zero-warning gate)
      run: |
        # Covers every R source dir EXCEPT platform/ (audit F-13). The engine scripts there
        # follow a compact style with ~290 purely-mechanical style lints (infix-spaces/commas/
        # semicolons — zero real defects); they are slated for a dedicated styler pass rather than
        # mass-reformatted here, so they are excluded from this gate, not silently un-linted.
        Rscript -e 'if (!requireNamespace("lintr", quietly = TRUE)) install.packages("lintr", repos = "https://cloud.r-project.org")'
        Rscript -e 'files <- list.files(c("03_metadata/adam", "01_source_data", "04_analysis_datasets/programs/r", "06_qc_evidence/reconciliation", "03_metadata/define", "05_outputs/tfl", "tests"), pattern = "[.]R$", full.names = TRUE); n <- sum(vapply(files, function(f) length(lintr::lint(f)), integer(1))); if (n > 0) { for (f in files) print(lintr::lint(f)); stop(sprintf("lintr gate failed: %d issue(s)", n)) }; cat(sprintf("lintr gate passed: 0 issues across %d files\n", length(files)))'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pyreadstat lxml saspy pyyaml openpyxl usdm==0.66.0 "jsonschema>=4"

    - name: Delivery architecture controls
      run: |
        # Rebuilds non-seal reports and validates machine-readable layer/workstream
        # contracts. --ci skips seal-mutating builders (log cleanliness re-scan,
        # release-run manifest, RC checklist) so committed Path A seals stay intact
        # for the verify_release step. Architecture wiring failures still fail CI.
        python3 platform/build_delivery_controls.py --ci

    - name: SAS static-analysis gate (blocks on hardcoded paths)
      run: |
        python3 platform/lint_sas.py

    - name: CDISC CORE ADaM rule-pack validation (well-formedness gate)
      run: |
        python -m pip install pyyaml
        python3 platform/validate_core_rules.py

    - name: Run unit tests (Broker + Seeder)
      run: |
        python3 platform/test_oda_broker.py

    - name: Run clinical pipeline smoke test (Demo)
      run: |
        python3 platform/cibuild.py --demo

    - name: Run TFL regression and rendered-figure QC tests
      run: |
        Rscript tests/test_lab_shift_table.R
        Rscript tests/test_figure_outputs.R
        Rscript tests/test_tfl_population_contract.R
        python3 platform/check_gate_g07_reviewer_package.py

    - name: Run ADaM conformance check gate
      run: |
        bash platform/run_adam_conformance.sh

    - name: Validate Define-XML Metadata (ADaM & SDTM)
      run: |
        bash 03_metadata/define/validate_xsd.sh 03_metadata/define/define.xml
        bash 03_metadata/define/validate_xsd.sh 03_metadata/define/define_sdtm.xml
        python3 03_metadata/define/validate_define.py 03_metadata/define/define.xml
        python3 03_metadata/define/validate_define.py 03_metadata/define/define_sdtm.xml

    - name: eCTD package freshness gate (Module 5 package == source)
      run: |
        # Audit F-01: the materialized Module 5 submission copies must not drift in CONTENT from the
        # governing source (this is how the CT-code regression slipped into the committed package).
        # define.xml carries a build-time AsOfDateTime that write_telemetry restamps AFTER the
        # packaging stage, so compare content with that volatile stamp stripped — a real content
        # drift still fails the build; a pure restamp lag does not.
        strip() { grep -v 'AsOfDateTime' "$1"; }
        diff <(strip 03_metadata/define/define.xml)      <(strip 08_submission_package/m5/datasets/tropic/analysis/adam/datasets/define.xml)
        diff <(strip 03_metadata/define/define_sdtm.xml) <(strip 08_submission_package/m5/datasets/tropic/tabulations/sdtm/datasets/define.xml)
        echo "eCTD freshness gate: Module 5 define/conformance content matches source."

    - name: ADaM specification conformance gates (C-4 inversion)
      run: |
        # The authoritative spec (03_metadata/adam/ADaM_spec.xlsx) governs both
        # define.xml and the produced data. Assert both, and prove the define gate
        # actually detects drift (self-test) rather than being a no-op.
        Rscript platform/gen_adam_labels.R
        Rscript 03_metadata/define/check_define_conformance.R
        Rscript 03_metadata/define/check_define_conformance.R --self-test
        Rscript 04_analysis_datasets/programs/r/spec_data_checks.R

    - name: CT cross-validation (spec Codelists vs CDISC CT)
      run: |
        # Validates the ADaM spec's NCI controlled-terminology codes against authoritative CDISC CT
        # (audit F-13). Needs the CDISC Library API key (repo secret) or the offline CORE cache.
        # Neither is present in this repo's CI (no CDISC_LIBRARY_API_KEY secret configured, and
        # the offline cache is gitignored, so a fresh checkout never has it) -- the script's own
        # distinct SKIP_EXIT=2 makes that visible in the log rather than silently passing, but
        # --allow-skip is what turns that into a clean (exit 0) step instead of a hard job
        # failure; a genuine violation (a real CT mismatch) still fails the step either way.
        python3 platform/ct_cross_validation.py --allow-skip
      env:
        CDISC_LIBRARY_API_KEY: ${{ secrets.CDISC_LIBRARY_API_KEY }}

    - name: USDM study-definition build (data-free gate)
      run: |
        # build_usdm.py constructs the USDM v3.0 study definition from the usdm_model
        # classes (no patient data) — so, unlike the Dataset-JSON/ARS generators, it can
        # run in the data-free CI. Construction IS validation: a non-zero exit fails here.
        # (Dataset-JSON/ARS are data-dependent and are gated in the full pipeline instead.)
        python3 platform/build_usdm.py

    - name: Verify committed GREEN-ODA evidence badge (static re-check)
      run: |
        # The evidence/ snapshot (audit C-1) is the durable double-programming proof, committed
        # separately from live telemetry so a sim/--demo run can never clobber it. A committed
        # snapshot nobody re-checks is just an assertion — this independently re-verifies its
        # internal consistency (DISTINCT tags aren't contradicted by identical hashes) and its
        # cross-consistency with the other three evidence files, entirely from data already in
        # the checkout (audit F-14: real *.xpt are gitignored, so this is what IS staticly
        # checkable without a data-bearing checkout).
        python3 platform/verify_evidence.py

    - name: Path A release verification (seal pack)
      run: |
        # Same gate as path-a-seal-verify job; kept at end of full suite so a full CI green
        # implies seals still PASS after other steps (no ODA re-run).
        python3 scripts/verify_release.py
