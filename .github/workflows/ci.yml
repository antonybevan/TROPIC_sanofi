name: TROPIC Clinical Pipeline CI

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_live_ct:
        description: 'Run live CDISC Library controlled-terminology cross-validation'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.head_ref is the source branch for pull requests; ref_name is the source
  # branch for pushes. This deduplicates a push and its same-branch PR run.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Controlled release seal re-check: no SAS, no patient data, no renv.
  # Proves committed seals + claim docs still pass scripts/verify_release.py.
  path-a-seal-verify:
    # Keep the historical required-status context used by main branch protection.
    name: Path A seal verify (verify_release)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10.20'

    - name: Controlled release verification
      run: |
        # Recheck sealed control JSONs, product claim, and findings.
        # Does not re-run ODA/SAS. Exit non-zero fails CI.
        python3 scripts/verify_release.py
        # shell wrapper parity
        bash scripts/verify_release.sh

    - name: Test release-seal verifier
      run: python3 tests/test_verify_release.py

  validate:
    name: Run Tests & Conformance Gates
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Gitleaks secret scan (pinned v8.18.4, matches .pre-commit-config)
      run: |
        # Extract outside the checkout so the binary never dirties the worktree;
        # the final verify_release step fails on any untracked material file.
        archive="$RUNNER_TEMP/gitleaks_8.18.4_linux_x64.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          --output "$archive" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
        echo "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d  $archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
        "$RUNNER_TEMP/gitleaks" detect --source . --no-banner --redact

    - name: Set up R
      uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      with:
        r-version: '4.6.0'

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10.20'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y fonts-liberation2 ghostscript libxml2-dev libssl-dev libcurl4-openssl-dev libxml2-utils poppler-utils

    - name: Cache renv packages
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/R/renv
        key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
        restore-keys: |
          ${{ runner.os }}-renv-

    - name: Restore renv environment
      run: |
        export RENV_VERSION="$(python3 -c 'import json; print(json.load(open("renv.lock"))["Packages"]["renv"]["Version"])')"
        Rscript -e 'v <- Sys.getenv("RENV_VERSION"); url <- sprintf("https://cran.r-project.org/src/contrib/Archive/renv/renv_%s.tar.gz", v); dest <- file.path(tempdir(), basename(url)); download.file(url, dest, mode="wb", quiet=TRUE); install.packages(dest, repos=NULL, type="source")'
        test "$(Rscript -e 'cat(as.character(packageVersion("renv")))')" = "$RENV_VERSION"
        Rscript -e "renv::restore()"

    - name: Lint R sources (zero-warning gate)
      run: |
        # Covers every R source dir EXCEPT platform/ (audit F-13). The engine scripts there
        # follow a compact style with ~290 purely-mechanical style lints (infix-spaces/commas/
        # semicolons — zero real defects); they are slated for a dedicated styler pass rather than
        # mass-reformatted here, so they are excluded from this gate, not silently un-linted.
        export LINTR_VERSION='3.3.0.1'
        export LINTR_ARCHIVE_VERSION='3.3.0-1'
        Rscript -e 'install.packages("lintr", repos="https://cloud.r-project.org", dependencies=TRUE); v <- Sys.getenv("LINTR_VERSION"); av <- Sys.getenv("LINTR_ARCHIVE_VERSION"); if (as.character(packageVersion("lintr")) != v) { url <- sprintf("https://cran.r-project.org/src/contrib/Archive/lintr/lintr_%s.tar.gz", av); dest <- file.path(tempdir(), basename(url)); download.file(url, dest, mode="wb", quiet=TRUE); install.packages(dest, repos=NULL, type="source") }; stopifnot(as.character(packageVersion("lintr")) == v)'
        Rscript -e 'files <- list.files(c("03_metadata/adam", "01_source_data", "04_analysis_datasets/programs/r", "06_qc_evidence/reconciliation", "03_metadata/define", "05_outputs/tfl", "07_reviewer_explanation/tools/shiny", "tests"), pattern = "[.]R$", full.names = TRUE); n <- sum(vapply(files, function(f) length(lintr::lint(f)), integer(1))); if (n > 0) { for (f in files) print(lintr::lint(f)); stop(sprintf("lintr gate failed: %d issue(s)", n)) }; cat(sprintf("lintr gate passed: 0 issues across %d files\n", length(files)))'

    - name: Install Python dependencies
      run: |
        python -m pip install --requirement requirements-ci.txt

    - name: Delivery architecture controls
      run: |
        # Rebuilds non-seal reports and validates machine-readable layer/workstream
        # contracts. --ci skips seal-mutating builders (log cleanliness re-scan,
        # release-run manifest and RC checklist so committed release seals stay intact
        # for the verify_release step. Architecture wiring failures still fail CI.
        python3 platform/build_delivery_controls.py --ci

    - name: Regulatory baseline and qualification boundary
      run: |
        python3 platform/check_regulatory_baseline.py --check-only
        python3 -m pytest -q tests/test_regulatory_baseline.py tests/test_p21_staging.py

    - name: SAS static-analysis gate (blocks on hardcoded paths)
      run: |
        python3 platform/lint_sas.py

    - name: CDISC CORE ADaM rule-pack validation (well-formedness gate)
      run: |
        python3 platform/validate_core_rules.py

    - name: Validate manifest-to-executor DAG wiring
      run: python3 platform/cibuild.py --validate-dag

    - name: Run unit tests (Broker + Seeder)
      run: |
        python3 platform/test_oda_broker.py
        python3 tests/test_phase2_staging.py

    - name: Run data-free regression tests (ARM, abort telemetry, F-042)
      run: |
        python3 -m pytest -q tests/test_pipeline_abort_scope.py tests/test_define_arm_contract.py tests/test_f042_sas_response_control.py tests/test_submission_surface.py
        Rscript tests/test_f042_provisional_pain_derivation.R

    - name: Run clinical pipeline smoke test (Demo)
      run: |
        python3 platform/cibuild.py --demo

    - name: Run TFL regression and rendered-figure QC tests
      run: |
        Rscript tests/test_lab_shift_table.R
        Rscript tests/test_figure_outputs.R
        Rscript tests/test_tfl_population_contract.R
        # Re-check the committed G07 evidence without rewriting its timestamp;
        # the final release seal requires a clean material worktree.
        python3 platform/check_gate_g07_reviewer_package.py --check-only

    - name: Run reviewer-dashboard data-free contract tests
      run: Rscript tests/test_shiny_dashboard.R

    - name: Run ADaM conformance check gate
      run: |
        bash platform/run_adam_conformance.sh --check-only

    - name: Validate Define-XML Metadata (ADaM & SDTM)
      run: |
        bash 03_metadata/define/validate_xsd.sh 03_metadata/define/define.xml
        bash 03_metadata/define/validate_xsd.sh 03_metadata/define/define_sdtm.xml
        python3 03_metadata/define/validate_define.py 03_metadata/define/define.xml
        python3 03_metadata/define/validate_define.py 03_metadata/define/define_sdtm.xml

    - name: eCTD package freshness gate (Module 5 package == source)
      run: |
        # Audit F-01: the materialized Module 5 submission copies must not drift in CONTENT from the
        # governing source (this is how the CT-code regression slipped into the committed package).
        # define.xml carries a build-time AsOfDateTime that write_telemetry restamps AFTER the
        # packaging stage, so compare content with that volatile stamp stripped — a real content
        # drift still fails the build; a pure restamp lag does not.
        strip() { grep -v 'AsOfDateTime' "$1"; }
        diff <(strip 03_metadata/define/define.xml)      <(strip 08_submission_package/m5/datasets/tropic/analysis/adam/datasets/define.xml)
        diff <(strip 03_metadata/define/define_sdtm.xml) <(strip 08_submission_package/m5/datasets/tropic/tabulations/sdtm/datasets/define.xml)
        echo "eCTD freshness gate: Module 5 define/conformance content matches source."

    - name: ADaM specification conformance gates (C-4 inversion)
      run: |
        # The authoritative spec (03_metadata/adam/ADaM_spec.xlsx) governs both
        # define.xml and the produced data. Assert both, and prove the define gate
        # actually detects drift (self-test) rather than being a no-op.
        Rscript platform/gen_adam_labels.R
        Rscript 03_metadata/define/check_define_conformance.R
        Rscript 03_metadata/define/check_define_conformance.R --self-test
        Rscript 04_analysis_datasets/programs/r/spec_data_checks.R

    - name: CT cross-validation (spec Codelists vs CDISC CT)
      run: |
        # Validates the ADaM spec's NCI controlled-terminology codes against authoritative CDISC CT
        # (audit F-13). Needs the CDISC Library API key (repo secret) or the offline CORE cache.
        # Live CT is isolated to the trusted/manual job below; no secret is exposed
        # to pull requests or codex/** pushes. This data-free job records the boundary.
        echo "CT cross-validation: no live key is exposed to this untrusted/data-free job -> SKIPPED (--allow-skip)."
        python3 platform/ct_cross_validation.py --allow-skip

    - name: Report data-free conformance coverage
      run: python3 platform/ci_coverage_summary.py

    - name: USDM study-definition build (data-free gate)
      run: |
        # build_usdm.py constructs the USDM v3.0 study definition from the usdm_model
        # classes (no patient data) — so, unlike the Dataset-JSON/ARS generators, it can
        # run in the data-free CI. Construction IS validation: a non-zero exit fails here.
        # (Dataset-JSON/ARS are data-dependent and are gated in the full pipeline instead.)
        python3 platform/build_usdm.py

    - name: Verify committed GREEN-ODA evidence badge (static re-check)
      run: |
        # The evidence/ snapshot (audit C-1) is the durable double-programming proof, committed
        # separately from live telemetry so a sim/--demo run can never clobber it. A committed
        # snapshot nobody re-checks is just an assertion — this independently re-verifies its
        # internal consistency (DISTINCT tags aren't contradicted by identical hashes) and its
        # cross-consistency with the other three evidence files, entirely from data already in
        # the checkout (audit F-14: real *.xpt are gitignored, so this is what IS staticly
        # checkable without a data-bearing checkout).
        python3 platform/verify_evidence.py

    - name: Checkout clean seal copy
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      with:
        path: _seal_checkout
        clean: true

    - name: Controlled release verification (seal pack)
      working-directory: _seal_checkout
      run: |
        # Validate the committed seal pack from a fresh checkout. Earlier data-free steps
        # may regenerate CI-only status JSONs in the primary workspace; they must not alter
        # the immutable release artifacts being verified here.
        python3 scripts/verify_release.py

  ct-cross-validation:
    name: CT cross-validation (trusted/manual)
    # A repository variable enables the trusted main-branch run after the secret and
    # optional environment approval are configured. Manual dispatch can opt in directly.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_live_ct == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CDISC_LIBRARY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    environment: cdisc-ct
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.10.20'

    - name: Install locked Python dependencies
      run: python -m pip install --requirement requirements-ci.txt

    - name: Run live CT cross-validation
      env:
        CDISC_LIBRARY_API_KEY: ${{ secrets.CDISC_LIBRARY_API_KEY }}
      run: |
        test -n "$CDISC_LIBRARY_API_KEY" || { echo "CDISC_LIBRARY_API_KEY is required in the protected cdisc-ct environment"; exit 1; }
        python3 platform/ct_cross_validation.py
